<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://leoncoolmoon.github.io/icon.png" />
  </head>
  <body>
    <div class="container">
      <h1 style="margin-bottom: 2px;">Quiz App</h1>
      <h4 style="margin-top: 0px;">Choose a mode to begin</h4>
      <div id="quiz"></div>
      <div id="result" class="result"></div>
      <button id="submit" class="button">Submit</button>
      <button id="retry" class="button hide">Play Again</button>
      <button id="showAnswer" class="button hide">Show Answers</button>
    </div>
    <script src="script.js"></script>
    <script src="../share.js" defer></script>
  </body>
</html>
