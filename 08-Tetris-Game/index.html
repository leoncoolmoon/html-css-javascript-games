  <body>
    <div id="tetris">
      <div id="info">
        <div id="next_shape"></div>
        <p id="level"><span data-en="Level" data-zh="等级">Level</span>: <span class="val"></span></p>
        <p id="lines"><span data-en="Lines" data-zh="行数">Lines</span>: <span class="val"></span></p>
        <p id="score"><span data-en="Score" data-zh="分数">Score</span>: <span class="val"></span></p>
        <p id="time"><span data-en="Time" data-zh="时间">Time</span>: <span class="val"></span></p>
        <button id="start">▶️</button>
        <button id="lang-toggle" style="background: #444; color: white; border: 1px solid #666; cursor: pointer; margin-top: 10px; border-radius: 4px; padding: 5px;">EN/中</button>
        <p class="red" data-en="Press the Esc button to pause" data-zh="按下 Esc 键暂停">Press the Esc button to pause<span></span></p>
      </div>
      <div id="canvas"></div>
    </div>
    <script type="text/javascript" src="script.js"></script>
    <script type="text/javascript" src="../ctrl.js"></script>
      <script src="../share.js" defer></script>
