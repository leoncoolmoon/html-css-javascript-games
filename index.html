<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Game Collection</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --primary-dark: #388E3C;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-muted: #666;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .meta-info {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .search-container {
            width: 100%;
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #ddd;
            box-shadow: var(--shadow);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }

        #search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border-top: 5px solid var(--primary-color);
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .game-card.hidden {
            display: none;
        }

        .game-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.25rem;
        }

        .game-card a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .game-card a:hover {
            text-decoration: underline;
        }

        .game-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0;
            flex-grow: 1;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .game-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game Collection">
    <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
    <header>
        <h1 id="main-title">Game Collection</h1>
        <div class="controls">
            <div class="meta-info">
                <button id="lang-toggle" class="btn">中文</button>
                <a href="https://github.com/leoncoolmoon/html-css-javascript-games/" class="btn" id="github-link">GitHub</a>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search games...">
            </div>
        </div>
    </header>
    <main class="game-grid" id="game-grid">
        <!-- Games will be injected here -->
    </main>

    <script src="games_data.js"></script>
    <script>
        let currentLang = localStorage.getItem('lang') || 'en';
        const searchInput = document.getElementById('search-input');
        const langToggle = document.getElementById('lang-toggle');
        const gameGrid = document.getElementById('game-grid');
        const mainTitle = document.getElementById('main-title');

        const translations = {
            en: {
                title: "Game Collection",
                searchPlaceholder: "Search games...",
                langToggle: "中文",
                github: "GitHub"
            },
            zh: {
                title: "游戏集合",
                searchPlaceholder: "搜索游戏...",
                langToggle: "English",
                github: "GitHub"
            }
        };

        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase();
            gameGrid.innerHTML = '';

            games.forEach(game => {
                const name = game[currentLang].name;
                const desc = game[currentLang].desc;

                if (name.toLowerCase().includes(searchTerm) || desc.toLowerCase().includes(searchTerm)) {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <h3><a href="${game.href}">${game.num}. ${name}</a></h3>
                        <p>${desc}</p>
                    `;
                    gameGrid.appendChild(card);
                }
            });
        }

        function updateUI() {
            const t = translations[currentLang];
            mainTitle.textContent = t.title;
            searchInput.placeholder = t.searchPlaceholder;
            langToggle.textContent = t.langToggle;
            document.documentElement.lang = currentLang;
            renderGames();
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            localStorage.setItem('lang', currentLang);
            updateUI();
        });

        searchInput.addEventListener('input', renderGames);

        // Initial render
        updateUI();

        // PWA registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
