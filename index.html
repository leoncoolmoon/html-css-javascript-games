<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Game Collection</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --primary-dark: #388E3C;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-muted: #666;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
            --tab-border: #4CAF50;
            --tab-bg: white;
            --tab-text: #4CAF50;
            --input-bg: #ffffff;
            --input-border: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
            --tab-border: #4CAF50;
            --tab-bg: #2d2d2d;
            --tab-text: #4CAF50;
            --input-bg: #333;
            --input-border: #444;
        }

        @media (prefers-color-scheme: dark) {
            [data-theme="system"] {
                --bg-color: #1a1a1a;
                --card-bg: #2d2d2d;
                --text-color: #e0e0e0;
                --text-muted: #aaaaaa;
                --shadow: 0 4px 6px rgba(0,0,0,0.3);
                --tab-border: #4CAF50;
                --tab-bg: #2d2d2d;
                --tab-text: #4CAF50;
                --input-bg: #333;
                --input-border: #444;
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .meta-info {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: white !important;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .search-container {
            width: 100%;
            position: relative;
        }

        .category-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .tab-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid var(--tab-border);
            background: var(--tab-bg);
            color: var(--tab-text);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .tab-btn:hover {
            opacity: 0.8;
        }

        #search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            box-shadow: var(--shadow);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }

        #search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-height: 220px;
            border: none;
            background-size: cover;
            background-position: center;
            text-decoration: none;
            color: white;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.4);
        }

        .game-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.2) 100%);
            z-index: 1;
            transition: var(--transition);
        }

        .game-card-content {
            position: relative;
            z-index: 2;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .game-card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.25rem;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .game-card p {
            color: #ddd;
            font-size: 0.9rem;
            margin-bottom: 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .game-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game Collection">
    <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
    <header>
        <h1 id="main-title">Game Collection</h1>
        <div class="controls">
            <div class="meta-info">
                <button id="theme-toggle" class="btn" title="Toggle Theme">💻</button>
                <button id="lang-toggle" class="btn">中文</button>
                <a href="https://github.com/leoncoolmoon/html-css-javascript-games/" class="btn" id="github-link">GitHub</a>
            </div>
            <div class="category-tabs" id="category-tabs">
                <button class="tab-btn active" data-category="All">All</button>
                <button class="tab-btn" data-category="Arcade">Arcade</button>
                <button class="tab-btn" data-category="Puzzle">Puzzle</button>
                <button class="tab-btn" data-category="Logic">Logic</button>
                <button class="tab-btn" data-category="Spelling">Spelling</button>
                <button class="tab-btn" data-category="Board">Board</button>
                <button class="tab-btn" data-category="Typing">Typing</button>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search games...">
            </div>
        </div>
    </header>
    <div id="loading">Loading games...</div>
    <main class="game-grid" id="game-grid" style="display: none;">
        <!-- Games will be injected here -->
    </main>

    <script src="path.js"></script>
    <script>
        let currentLang = localStorage.getItem('lang') || 'en';
        let currentTheme = localStorage.getItem('theme') || 'system';
        let currentCategory = 'All';
        let allGames = [];

        const searchInput = document.getElementById('search-input');
        const langToggle = document.getElementById('lang-toggle');
        const themeToggle = document.getElementById('theme-toggle');
        const gameGrid = document.getElementById('game-grid');
        const mainTitle = document.getElementById('main-title');
        const loadingIndicator = document.getElementById('loading');

        const translations = {
            en: {
                title: "Game Collection",
                searchPlaceholder: "Search games...",
                langToggle: "中文",
                loading: "Loading games...",
                github: "GitHub",
                categories: {
                    All: "All",
                    Arcade: "Arcade",
                    Puzzle: "Puzzle",
                    Logic: "Logic",
                    Spelling: "Spelling",
                    Board: "Board",
                    Typing: "Typing"
                }
            },
            zh: {
                title: "游戏集合",
                searchPlaceholder: "搜索游戏...",
                langToggle: "English",
                loading: "正在加载游戏...",
                github: "GitHub",
                categories: {
                    All: "全部",
                    Arcade: "街机",
                    Puzzle: "益智",
                    Logic: "逻辑",
                    Spelling: "拼写",
                    Board: "棋牌",
                    Typing: "打字"
                }
            }
        };

        const themeIcons = {
            light: "🌞",
            dark: "🌚",
            system: "💻"
        };

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = themeIcons[theme];
        }

        themeToggle.addEventListener('click', () => {
            if (currentTheme === 'system') currentTheme = 'light';
            else if (currentTheme === 'light') currentTheme = 'dark';
            else currentTheme = 'system';

            localStorage.setItem('theme', currentTheme);
            applyTheme(currentTheme);
        });

        async function fetchGameMeta(gameObj) {
            try {
                const response = await fetch(`${gameObj.path}README.md`);
                const text = await response.text();
                const match = text.match(/<!--\s*GAME_META:(.*?)-->/s);
                if (match && match[1]) {
                    const meta = JSON.parse(match[1].trim());
                    meta.href = gameObj.path;
                    meta.category = gameObj.category;
                    return meta;
                }
            } catch (e) {
                console.error(`Failed to load meta for ${gameObj.path}`, e);
            }
            return null;
        }

        async function init() {
            applyTheme(currentTheme);
            loadingIndicator.textContent = translations[currentLang].loading;
            const metaPromises = gamePaths.map(gameObj => fetchGameMeta(gameObj));
            const results = await Promise.all(metaPromises);
            allGames = results.filter(g => g !== null);

            loadingIndicator.style.display = 'none';
            gameGrid.style.display = 'grid';
            setupTabs();
            updateUI();
        }

        function setupTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    renderGames();
                });
            });
        }

        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase();
            gameGrid.innerHTML = '';

            allGames.forEach(game => {
                const name = game[currentLang].name;
                const desc = game[currentLang].desc;
                const matchesSearch = name.toLowerCase().includes(searchTerm) || desc.toLowerCase().includes(searchTerm);
                const matchesCategory = currentCategory === 'All' || game.category === currentCategory;

                if (matchesSearch && matchesCategory) {
                    const card = document.createElement('a');
                    card.href = game.href;
                    card.className = 'game-card';
                    card.style.backgroundImage = `url('${game.href}snap.jpg')`;
                    card.innerHTML = `
                        <div class="game-card-content">
                            <h3>${game.num}. ${name}</h3>
                            <p>${desc}</p>
                        </div>
                    `;
                    gameGrid.appendChild(card);
                }
            });
        }

        function updateUI() {
            const t = translations[currentLang];
            mainTitle.textContent = t.title;
            searchInput.placeholder = t.searchPlaceholder;
            langToggle.textContent = t.langToggle;
            document.documentElement.lang = currentLang;

            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.textContent = t.categories[tab.dataset.category];
            });

            renderGames();
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            localStorage.setItem('lang', currentLang);
            updateUI();
        });

        searchInput.addEventListener('input', renderGames);

        init();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
