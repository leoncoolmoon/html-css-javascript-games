/* ── Audio engine ── */
let audioCtx = null, muted = false;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playTone(freq,dur,type='sine',vol=0.08){
  if(muted)return;
  try{
    const c=getCtx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol,c.currentTime+0.04);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.start(c.currentTime);o.stop(c.currentTime+dur);
  }catch(e){}
}
function playFound(){[523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,.25,'sine',.1),i*100))}

/* ── Background canvas ── */
const cvs=document.getElementById('bg-canvas');
const ctx2=cvs.getContext('2d');
let W,H,particles=[];
function resizeCvs(){W=cvs.width=window.innerWidth;H=cvs.height=window.innerHeight}
resizeCvs();window.addEventListener('resize',()=>{resizeCvs();initParticles()});

function initParticles(){
  particles=Array.from({length:38},()=>({
    x:Math.random()*W,y:Math.random()*H,
    r:1+Math.random()*3,
    vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
    alpha:0.08+Math.random()*0.18,
    hue:120+Math.random()*60
  }));
}
initParticles();

let t=0;
function drawBg(){
  t+=0.003;
  const g=ctx2.createLinearGradient(0,0,W,H);
  const h1=120+Math.sin(t)*20, h2=160+Math.cos(t*.7)*20;
  g.addColorStop(0,`hsl(${h1},45%,82%)`);
  g.addColorStop(.5,`hsl(${(h1+h2)/2},35%,88%)`);
  g.addColorStop(1,`hsl(${h2},40%,78%)`);
  ctx2.fillStyle=g;
  ctx2.fillRect(0,0,W,H);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx2.beginPath();
    ctx2.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx2.fillStyle=`hsla(${p.hue},60%,60%,${p.alpha})`;
    ctx2.fill();
  });
  requestAnimationFrame(drawBg);
}
drawBg();

async function fetchWords(theme){
    const prompt = `Give me exactly 8 words related to the theme: "${theme}". Rules: each word 3-8 letters, UPPERCASE, no spaces/hyphens, all different, common words. Return ONLY a JSON array. Example: ["BALLET","SALSA","TANGO","WALTZ","SWING","FOXTROT","JIVE","SAMBA"]`;
    
    try {
        // 将 Anthropic 的地址换成 Pollinations 的地址即可
        const res = await fetch("https://text.pollinations.ai/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
                // Pollinations 不需要 Authorization 头！
            },
            body: JSON.stringify({
                model: "openai", // 或者使用其他免费模型，如 "mistral"
                messages: [{ role: "user", content: prompt }],
                max_tokens: 300
            })
        });

        if (!res.ok) throw new Error("API 请求失败");
        const data = await res.json();
        // Pollinations 返回格式与 OpenAI 相同，因此解析方式也需要调整
        const text = data.choices[0].message.content;
        const arr = JSON.parse(text.replace(/```json|```/g, "").trim());
        return arr.map(w => w.toUpperCase().replace(/[^A-Z]/g, ""))
                  .filter(w => w.length >= 3 && w.length <= 8)
                  .slice(0, 8);
    } catch (error) {
        console.error("获取单词失败:", error);
        return ["DEFAULT", "WORDS", "HERE", "FOR", "SAFETY"];
    }
}
function makeGrid(){
  grid=Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(""));
  placed=[];
  const shuffled=[...words].sort(()=>Math.random()-.5);
  for(const w of shuffled)placeWord(w);
  for(let r=0;r<GRID_SIZE;r++)
    for(let c=0;c<GRID_SIZE;c++)
      if(!grid[r][c])grid[r][c]=String.fromCharCode(65+Math.floor(Math.random()*26));
}

function placeWord(word){
  /* Truly random: shuffle ALL (dir, row, col) combos, try them in random order */
  const candidates=[];
  for(const dir of DIRS)
    for(let r=0;r<GRID_SIZE;r++)
      for(let c=0;c<GRID_SIZE;c++)
        candidates.push([dir,r,c]);
  /* Fisher-Yates shuffle */
  for(let i=candidates.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [candidates[i],candidates[j]]=[candidates[j],candidates[i]];
  }
  for(const [dir,r,c] of candidates){
    if(canPlace(word,r,c,dir)){
      const cells=[];
      for(let i=0;i<word.length;i++){
        grid[r+dir[0]*i][c+dir[1]*i]=word[i];
        cells.push([r+dir[0]*i,c+dir[1]*i]);
      }
      placed.push({word,cells});
      return true;
    }
  }
  return false;
}

function canPlace(word,r,c,dir){
  for(let i=0;i<word.length;i++){
    const nr=r+dir[0]*i,nc=c+dir[1]*i;
    if(nr<0||nr>=GRID_SIZE||nc<0||nc>=GRID_SIZE)return false;
    if(grid[nr][nc]&&grid[nr][nc]!==word[i])return false;
  }
  return true;
}

function renderGrid(){
  const el=document.getElementById("grid");
  el.style.gridTemplateColumns=`repeat(${GRID_SIZE},36px)`;
  el.innerHTML="";
  for(let r=0;r<GRID_SIZE;r++)
    for(let c=0;c<GRID_SIZE;c++){
      const cell=document.createElement("div");
      cell.className="cell";cell.textContent=grid[r][c];
      cell.dataset.r=r;cell.dataset.c=c;
      el.appendChild(cell);
    }
  applyFoundColors();
  el.onmousedown=startSel;el.onmousemove=moveSel;el.onmouseup=endSel;
  el.ontouchstart=e=>{e.preventDefault();startSel(e.touches[0])};
  el.ontouchmove=e=>{e.preventDefault();moveSel(e.touches[0])};
  el.ontouchend=e=>{e.preventDefault();endSel()};
}

function renderWordList(){
  document.getElementById("word-list").innerHTML=
    words.map(w=>`<span class="word-chip${found.includes(w)?" found":""}" id="chip-${w}">${w}</span>`).join("");
}

function cellAt(e){
  const t=document.elementFromPoint(e.clientX,e.clientY);
  if(!t||!t.classList.contains("cell"))return null;
  return[parseInt(t.dataset.r),parseInt(t.dataset.c)];
}

function startSel(e){
  const rc=cellAt(e);if(!rc)return;
  selecting=true;selStart=rc;selCells=[rc];highlight();playSelect();
}

function moveSel(e){
  if(!selecting||!selStart)return;
  const rc=cellAt(e);if(!rc)return;
  const[r0,c0]=selStart,[r1,c1]=rc;
  const dr=r1-r0,dc=c1-c0;
  if(dr===0&&dc===0){selCells=[selStart];highlight();return}
  let sR=dr===0?0:dr/Math.abs(dr),sC=dc===0?0:dc/Math.abs(dc);
  if(Math.abs(dr)!==Math.abs(dc)&&dr!==0&&dc!==0){
    if(Math.abs(dr)>Math.abs(dc))sC=0;else sR=0;
  }
  selCells=[];
  for(let i=0;i<=Math.max(Math.abs(r1-r0),Math.abs(c1-c0));i++){
    const nr=r0+sR*i,nc=c0+sC*i;
    if(nr>=0&&nr<GRID_SIZE&&nc>=0&&nc<GRID_SIZE)selCells.push([nr,nc]);
  }
  highlight();
}

function endSel(){
  if(!selecting)return;selecting=false;checkWord();selCells=[];highlight();
}

function highlight(){
  document.querySelectorAll(".cell").forEach(c=>{
    const r=parseInt(c.dataset.r),col=parseInt(c.dataset.c);
    const isSel=selCells.some(([sr,sc])=>sr===r&&sc===col);
    c.classList.toggle("selecting",isSel);
    for(let i=0;i<8;i++)c.classList.remove(`found-${i}`);
    if(!isSel)
      for(const[word,ci]of Object.entries(foundColors)){
        const p=placed.find(p=>p.word===word);
        if(p&&p.cells.some(([pr,pc])=>pr===r&&pc===col))c.classList.add(`found-${ci}`);
      }
  });
}

function applyFoundColors(){
  document.querySelectorAll(".cell").forEach(c=>{
    const r=parseInt(c.dataset.r),col=parseInt(c.dataset.c);
    for(let i=0;i<8;i++)c.classList.remove(`found-${i}`);
    for(const[word,ci]of Object.entries(foundColors)){
      const p=placed.find(p=>p.word===word);
      if(p&&p.cells.some(([pr,pc])=>pr===r&&pc===col))c.classList.add(`found-${ci}`);
    }
  });
}

function checkWord(){
  const letters=selCells.map(([r,c])=>grid[r][c]).join("");
  const rev=letters.split("").reverse().join("");
  for(const{word,cells}of placed){
    if(found.includes(word))continue;
    if(letters===word||rev===word){
      const ci=found.length%8;
      found.push(word);foundColors[word]=ci;
      const chip=document.getElementById(`chip-${word}`);
      if(chip)chip.className="word-chip found";
      applyFoundColors();
      const entry=DICT[word]||DICT[word.toUpperCase()];
      const def=entry?`${entry.pos} ${entry.def}`:"A great word!";
      showToast(word,def);
      if(found.length===placed.length){
        document.getElementById("win-msg").style.display="block";
        document.getElementById("status").textContent="";
        playWin();
      } else {
        document.getElementById("status").textContent=`✓ Found: ${word}`;
        playFound();
      }
      return;
    }
  }
  document.getElementById("status").textContent="";
}

function resetSelection(){
  found=[];foundColors={};
  document.getElementById("win-msg").style.display="none";
  document.getElementById("status").textContent="";
  renderGrid();renderWordList();
}

async function loadNewTheme(){
  const theme=document.getElementById("theme-select").value;
  document.getElementById("theme-title").textContent=theme.toUpperCase();
  document.getElementById("game-area").style.display="none";
  document.getElementById("loading-overlay").innerHTML='<span class="spinner"></span>Fetching words...';
  document.getElementById("loading-overlay").style.display="block";
  let source="AI";
  try{
    words=await fetchWords(theme);
    if(!words||words.length<4)throw new Error("few");
  }catch(e){
    words=[...(FALLBACK[theme]||FALLBACK.Dance)].sort(()=>Math.random()-.5);
    source="built-in dictionary";
  }
  found=[];foundColors={};
  makeGrid();
  document.getElementById("loading-overlay").style.display="none";
  document.getElementById("game-area").style.display="block";
  document.getElementById("win-msg").style.display="none";
  document.getElementById("status").textContent="";
  document.getElementById("source-tag").textContent=`Words sourced from: ${source}`;
  renderWordList();renderGrid();
  startAmbience();
}

loadNewTheme();
</script>
