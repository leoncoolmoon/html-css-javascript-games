/* ── Audio engine ── */
let audioCtx = null, muted = false;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playTone(freq,dur,type='sine',vol=0.08){
  if(muted)return;
  try{
    const c=getCtx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol,c.currentTime+0.04);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.start(c.currentTime);o.stop(c.currentTime+dur);
  }catch(e){}
}
function playFound(){[523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,.25,'sine',.1),i*100))}

const ctx2=cvs.getContext('2d');
let W,H,particles=[];
function resizeCvs(){W=cvs.width=window.innerWidth;H=cvs.height=window.innerHeight}
resizeCvs();window.addEventListener('resize',()=>{resizeCvs();initParticles()});

function initParticles(){
  particles=Array.from({length:38},()=>({
    x:Math.random()*W,y:Math.random()*H,
    r:1+Math.random()*3,
    vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
    alpha:0.08+Math.random()*0.18,
    hue:120+Math.random()*60
  }));
}
initParticles();

let t=0;
function drawBg(){
  t+=0.003;
  const g=ctx2.createLinearGradient(0,0,W,H);
  const h1=120+Math.sin(t)*20, h2=160+Math.cos(t*.7)*20;
  g.addColorStop(0,`hsl(${h1},45%,82%)`);
  g.addColorStop(.5,`hsl(${(h1+h2)/2},35%,88%)`);
  g.addColorStop(1,`hsl(${h2},40%,78%)`);
  ctx2.fillStyle=g;
  ctx2.fillRect(0,0,W,H);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx2.beginPath();
    ctx2.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx2.fillStyle=`hsla(${p.hue},60%,60%,${p.alpha})`;
    ctx2.fill();
  });
  requestAnimationFrame(drawBg);
}
drawBg();

/* ── Word search logic ── */

// AI 获取单词和定义
async function fetchWords(theme){
    const prompt = `Give me exactly 8 words related to the theme: "${theme}". 
Rules: 
- Each word: 3-8 letters, UPPERCASE, no spaces/hyphens, all different, common words
- For each word, provide a short definition (one sentence, 5-15 words)

Return ONLY a JSON array where each element has: {"word": "WORD", "def": "Short definition"}
Example: [{"word":"BALLET","def":"Classical dance form with precise movements"},{"word":"SALSA","def":"Lively Latin dance of Cuban origin"}]

Return ONLY the JSON array, no other text.`;
    
    try {
        const res = await fetch("https://text.pollinations.ai/openai/v1/chat/completions", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                model: "openai",
                messages: [{ role: "user", content: prompt }],
                max_tokens: 800
            })
        });

        if (!res.ok) throw new Error("API 请求失败");
        const data = await res.json();
        const text = data.choices[0].message.content;
        const cleanedText = text.replace(/```json|```/g, "").trim();
        const wordDefArray = JSON.parse(cleanedText);
        
        const words = [];
        const definitions = {};
        
        for (const item of wordDefArray) {
            const word = item.word.toUpperCase().replace(/[^A-Z]/g, "");
            const def = item.def || "A great word!";
            if (word.length >= 3 && word.length <= 8) {
                words.push(word);
                definitions[word] = def;
            }
        }
        
        if (words.length < 4) throw new Error("Not enough words");
        return { words: words.slice(0, 8), definitions: definitions, theme: theme };
    } catch (error) {
        console.error("获取单词失败:", error);
        return null;
    }
}

// 预加载下一关
async function preloadNextLevel(currentThemeName) {
  if (isPreloading) return;
  isPreloading = true;
  
  // 随机选择下一个主题（不与当前相同）
  let availableThemes = ALL_THEMES.filter(t => t !== currentThemeName);
  if (availableThemes.length === 0) availableThemes = [...ALL_THEMES];
  const nextTheme = availableThemes[Math.floor(Math.random() * availableThemes.length)];
  
  try {
    const result = await fetchWords(nextTheme);
    if (result && result.words && result.words.length >= 4) {
      preloadedLevel = result;
      document.getElementById("next-badge").innerHTML = `✨ Next: ${nextTheme} (ready) ✨`;
    } else {
      // 使用 fallback
      preloadedLevel = {
        words: [...(FALLBACK[nextTheme] || FALLBACK.Dance)].sort(() => Math.random() - 0.5),
        definitions: {},
        theme: nextTheme
      };
      document.getElementById("next-badge").innerHTML = `📚 Next: ${nextTheme} (from dictionary)`;
    }
  } catch (e) {
    console.warn("Preload failed, using fallback");
    preloadedLevel = {
      words: [...(FALLBACK[nextTheme] || FALLBACK.Dance)].sort(() => Math.random() - 0.5),
      definitions: {},
      theme: nextTheme
    };
    document.getElementById("next-badge").innerHTML = `📚 Next: ${nextTheme} (ready)`;
  }
  isPreloading = false;
}

  foundColors = {};
  
  makeGrid();
  
  document.getElementById("win-msg").style.display = "none";
  document.getElementById("theme-title").textContent = currentTheme.toUpperCase();
  document.getElementById("source-tag").textContent = `Theme: ${currentTheme} | Ready to play!`;
  renderWordList();
  renderGrid();
  startAmbience();
  
  // 清除提示并开始预加载下一关
  document.getElementById("next-badge").innerHTML = "🔄 Loading next level...";
  preloadedLevel = null;
  
  // 后台预加载下一关
  setTimeout(() => preloadNextLevel(currentTheme), 100);
}

// 加载随机主题（初次启动或 fallback）
async function loadNewRandomTheme(n) {
  const randomTheme = ALL_THEMES[Math.floor(Math.random() * ALL_THEMES.length)];
  
  document.getElementById("theme-title").textContent = randomTheme.toUpperCase();
  document.getElementById("game-area").style.display = "none";
  document.getElementById("loading-overlay").innerHTML = '<span class="spinner"></span>Loading level...';
  document.getElementById("loading-overlay").style.display = "block";
  
  let source = "AI";
  let result = null;
  if(n == 1){
  try {
    result = await fetchWords(randomTheme);
    if (result && result.words && result.words.length >= 4) {
      words = result.words;
      currentDefinitions = result.definitions;
      currentTheme = randomTheme;
    } else {
      throw new Error("AI failed");
    }
  } catch(e) {
    console.warn("Using fallback dictionary:", e);
    words = [...(FALLBACK[randomTheme] || FALLBACK.Dance)].sort(() => Math.random() - 0.5);
    currentDefinitions = {};
    currentTheme = randomTheme;
    source = "built-in dictionary";
  }
}else{
    words = [...(FALLBACK[randomTheme] || FALLBACK.Dance)].sort(() => Math.random() - 0.5);
    currentDefinitions = {};
    currentTheme = randomTheme;
    source = "built-in dictionary";

}

  found = [];
  foundColors = {};
  makeGrid();
  
  document.getElementById("loading-overlay").style.display = "none";
  document.getElementById("game-area").style.display = "block";
  document.getElementById("win-msg").style.display = "none";
  document.getElementById("status").textContent = "";
  document.getElementById("source-tag").textContent = `Theme: ${currentTheme} | Source: ${source}`;
  document.getElementById("next-badge").innerHTML = "🔄 Preparing next level...";
  
  renderWordList();
  renderGrid();
  startAmbience();
  
  // 后台预加载下一关
  preloadedLevel = null;
  setTimeout(() => preloadNextLevel(currentTheme), 500);
}

// 先放置单词，再填充随机字母
function makeGrid(){
  grid = Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(""));
  placed = [];
  
  const shuffled = [...words].sort(() => Math.random() - 0.5);
  let success = true;
  
  for (const word of shuffled) {
    if (!placeWord(word)) {
      success = false;
      break;
    }
  }
  
  if (!success) {
    makeGrid();
    return;
  }
  
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (!grid[r][c]) {
        grid[r][c] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
      }
    }
  }
}

function placeWord(word){
  const candidates = [];
  for (const dir of DIRS) {
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (canPlace(word, r, c, dir)) {
          candidates.push({dir, r, c});
        }
      }
    }
  }
  
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  
  for (const {dir, r, c} of candidates) {
    const cells = [];
    for (let i = 0; i < word.length; i++) {
      const nr = r + dir[0] * i;
      const nc = c + dir[1] * i;
      cells.push([nr, nc]);
      grid[nr][nc] = word[i];
    }
    placed.push({word, cells});
    return true;
  }
  return false;
}

function canPlace(word, r, c, dir){
  for (let i = 0; i < word.length; i++) {
    const nr = r + dir[0] * i;
    const nc = c + dir[1] * i;
    if (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) return false;
    if (grid[nr][nc] && grid[nr][nc] !== word[i]) return false;
  }
  return true;
}

function renderGrid(){
  const el = document.getElementById("grid");
  el.style.gridTemplateColumns = `repeat(${GRID_SIZE},36px)`;
  el.innerHTML = "";
  for(let r = 0; r < GRID_SIZE; r++) {
    for(let c = 0; c < GRID_SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = grid[r][c];
      cell.dataset.r = r;
      cell.dataset.c = c;
      el.appendChild(cell);
    }
  }
  applyFoundColors();
  el.onmousedown = startSel;
  el.onmousemove = moveSel;
  el.onmouseup = endSel;
  el.ontouchstart = e => { e.preventDefault(); startSel(e.touches[0]); };
  el.ontouchmove = e => { e.preventDefault(); moveSel(e.touches[0]); };
  el.ontouchend = e => { e.preventDefault(); endSel(); };
}

function renderWordList(){
  document.getElementById("word-list").innerHTML = words.map(w => 
    `<span class="word-chip${found.includes(w) ? " found" : ""}" id="chip-${w}">${w}</span>`
  ).join("");
}

function cellAt(e){
  const t = document.elementFromPoint(e.clientX, e.clientY);
  if(!t || !t.classList.contains("cell")) return null;
  return [parseInt(t.dataset.r), parseInt(t.dataset.c)];
}

function startSel(e){
  const rc = cellAt(e);
  if(!rc) return;
  selecting = true;
  selStart = rc;
  selCells = [rc];
  highlight();
  playSelect();
}

function moveSel(e){
  if(!selecting || !selStart) return;
  const rc = cellAt(e);
  if(!rc) return;
  const [r0,c0] = selStart;
  const [r1,c1] = rc;
  const dr = r1 - r0, dc = c1 - c0;
  
  if(dr === 0 && dc === 0) {
    selCells = [selStart];
    highlight();
    return;
  }
  
  let sR = dr === 0 ? 0 : dr / Math.abs(dr);
  let sC = dc === 0 ? 0 : dc / Math.abs(dc);
  
  if(Math.abs(dr) !== Math.abs(dc) && dr !== 0 && dc !== 0) {
    if(Math.abs(dr) > Math.abs(dc)) sC = 0;
    else sR = 0;
  }
  
  selCells = [];
  const steps = Math.max(Math.abs(r1 - r0), Math.abs(c1 - c0));
  for(let i = 0; i <= steps; i++) {
    const nr = r0 + sR * i;
    const nc = c0 + sC * i;
    if(nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
      selCells.push([nr, nc]);
    }
  }
  highlight();
}

function endSel(){
  if(!selecting) return;
  selecting = false;
  checkWord();
  selCells = [];
  highlight();
}

function highlight(){
  document.querySelectorAll(".cell").forEach(c => {
    const r = parseInt(c.dataset.r);
    const col = parseInt(c.dataset.c);
    const isSel = selCells.some(([sr,sc]) => sr === r && sc === col);
    c.classList.toggle("selecting", isSel);
    for(let i = 0; i < 8; i++) c.classList.remove(`found-${i}`);
    if(!isSel) {
      for(const [word, ci] of Object.entries(foundColors)) {
        const p = placed.find(p => p.word === word);
        if(p && p.cells.some(([pr,pc]) => pr === r && pc === col)) {
          c.classList.add(`found-${ci}`);
        }
      }
    }
  });
}

function applyFoundColors(){
  document.querySelectorAll(".cell").forEach(c => {
    const r = parseInt(c.dataset.r);
    const col = parseInt(c.dataset.c);
    for(let i = 0; i < 8; i++) c.classList.remove(`found-${i}`);
    for(const [word, ci] of Object.entries(foundColors)) {
      const p = placed.find(p => p.word === word);
      if(p && p.cells.some(([pr,pc]) => pr === r && pc === col)) {
        c.classList.add(`found-${ci}`);
      }
    }
  });
}

function checkWord(){
  const letters = selCells.map(([r,c]) => grid[r][c]).join("");
  const rev = letters.split("").reverse().join("");
  
  for(const {word, cells} of placed) {
    if(found.includes(word)) continue;
    if(letters === word || rev === word) {
      const ci = found.length % 8;
      found.push(word);
      foundColors[word] = ci;
      
      const chip = document.getElementById(`chip-${word}`);
      if(chip) chip.className = "word-chip found";
      applyFoundColors();
      
      let def;
      if(currentDefinitions && currentDefinitions[word]) {
        def = currentDefinitions[word];
      } else if(DICT[word]) {
        def = `${DICT[word].pos} ${DICT[word].def}`;
      } else {
        def = "A wonderful word from your theme!";
      }
      showToast(word, def);
      
      if(found.length === placed.length) {
        document.getElementById("win-msg").style.display = "block";
        document.getElementById("status").textContent = "";
        playWin();
        stopAmbience();
      } else {
        document.getElementById("status").textContent = `✓ Found: ${word}`;
        playFound();
      }
      return;
    }
  }
  document.getElementById("status").textContent = "";
}

function giveHint() {
  if (!placed.length || found.length === placed.length) {
    if (found.length === placed.length && placed.length > 0) {
      showToast("🎉", "You already found all words! Click Next Level to continue!");
    } else {
      showToast("No words", "Loading or no words available yet");
    }
    return;
  }
  
  const unfound = placed.filter(p => !found.includes(p.word));
  if (unfound.length === 0) {
    showToast("Complete!", "All words found! Click Next Level!");
    return;
  }
  
  const hintWord = unfound[Math.floor(Math.random() * unfound.length)];
  
  for (const [r, c] of hintWord.cells) {
    const cellDiv = document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
    if (cellDiv) {
      cellDiv.classList.add('hint');
      setTimeout(() => {
        cellDiv.classList.remove('hint');
      }, 1500);
    }
  }
  
  const def = currentDefinitions[hintWord.word] || 
              (DICT[hintWord.word] ? `${DICT[hintWord.word].pos} ${DICT[hintWord.word].def}` : null) ||
              "Try to find this word!";
  showToast(`💡 Hint: ${hintWord.word}`, def);
  playHint();
}

function resetSelection(){
  found = [];
  foundColors = {};
  document.getElementById("win-msg").style.display = "none";
  document.getElementById("status").textContent = "";
  renderGrid();
  renderWordList();
  startAmbience();
}

// 启动游戏 - 使用随机主题并开始预加载
loadNewRandomTheme(0);
</script>
